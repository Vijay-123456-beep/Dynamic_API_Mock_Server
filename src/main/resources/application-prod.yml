server:
  port: ${PORT:8088}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mockdb}
    username: ${SPRING_DATASOURCE_USERNAME:mockuser}
    password: ${SPRING_DATASOURCE_PASSWORD:mockpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  
  # Production security settings
  security:
    require-ssl: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:c3ByaW5nLWJvb3QtZGV2LXNlY3JldC1rZXktMzJieXRlc2Jhc2U2NA==}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
    com.vijay.mockserver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator configuration for production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
